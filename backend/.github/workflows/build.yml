name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./backend/F1Fantasy
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
      working-directory: ./backend/F1Fantasy
    
    - name: Restore test dependencies
      run: dotnet restore
      working-directory: ./backend/F1Fantasy.Tests
    
    - name: Build tests
      run: dotnet build --no-restore --configuration Release
      working-directory: ./backend/F1Fantasy.Tests
    
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "console;verbosity=normal" --filter "FullyQualifiedName~DatabaseIntegrationTests"
      working-directory: ./backend/F1Fantasy.Tests
      env:
        ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
