version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "10000:10000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:10000
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
    env_file:
      - .env
    volumes:
      # Optional: Uncomment for hot-reload during development
      # - ./F1Fantasy:/src/F1Fantasy
      - ./.env:/src/.env
    restart: unless-stopped

# Note: Render.com ignores this file and only uses the Dockerfile
# This compose file is purely for local development with:
# - Port 10000 (matching Render's default PORT)
# - Development environment
# - Automatic migrations via entrypoint script

