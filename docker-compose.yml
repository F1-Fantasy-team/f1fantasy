version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5168:8080"
      - "7183:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ./backend/F1Fantasy/appsettings.Development.json:/app/appsettings.Development.json:ro
    restart: unless-stopped
