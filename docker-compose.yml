version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5168:8080"
      - "7183:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ./backend/F1Fantasy/appsettings.Development.json:/app/appsettings.Development.json:ro
    restart: unless-stopped

  backend-java:
    build:
      context: ./backendJava/f1fantasy
      dockerfile: Dockerfile
    ports:
      - "8090:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    env_file:
      - .env
    restart: unless-stopped
